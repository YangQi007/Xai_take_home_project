services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/conversations
      - xai_api_key=${xai_api_key}
      - DEBUG=false
      - WORKER_COUNT=5
      - QUEUE_MAX_SIZE=1000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=conversations
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Data loading job - runs once on startup, safe to re-run (uses ON CONFLICT DO NOTHING)
  data-loader:
    build: .
    command: python scripts/load_sample_data.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/conversations
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
